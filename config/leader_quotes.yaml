# Company newsrooms and blogs: every recent post is read.
newsrooms:
  OpenAI: https://openai.com/news/rss.xml
  Google DeepMind: https://deepmind.google/blog/rss.xml
  Google: https://blog.google/technology/ai/rss/
  NVIDIA Newsroom: https://nvidianews.nvidia.com/releases.xml
  NVIDIA Blog: https://blogs.nvidia.com/feed/
  Microsoft: https://blogs.microsoft.com/feed/
  Meta: https://about.fb.com/feed/

# Technology press: read only when an item names a watched leader or company.
# Fortune's section feeds return 404, so its main feed is used. Axios article
# pages come back empty to a script, but its feed carries each article's full
# text, which is read instead.
press:
  TechCrunch: https://techcrunch.com/category/artificial-intelligence/feed/
  The Verge: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
  CNBC: https://www.cnbc.com/id/19854910/device/rss/rss.html
  ET Tech: https://economictimes.indiatimes.com/tech/rssfeeds/13357270.cms
  Wired: https://www.wired.com/feed/tag/ai/latest/rss
  MIT Technology Review: https://www.technologyreview.com/topic/artificial-intelligence/feed
  Fortune: https://fortune.com/feed/
  Axios: https://api.axios.com/feed/
  # 2026-09-27: business press, for the business and GCC leaders above.
  CNBC Top News: https://www.cnbc.com/id/100003114/device/rss/rss.html
  ET: https://economictimes.indiatimes.com/rssfeedstopstories.cms
  Mint: https://www.livemint.com/rss/companies
  Business Standard: https://www.business-standard.com/rss/companies-101.rss
  BusinessLine: https://www.thehindubusinessline.com/companies/feeder/default.rss
  CNBC-TV18: https://www.cnbctv18.com/commonfeeds/v1/cne/rss/business.xml
  # 2026-10-26: for the robotics, China, Germany and Netherlands leaders.
  The Robot Report: https://www.therobotreport.com/feed/
  IEEE Spectrum: https://spectrum.ieee.org/feeds/topic/robotics.rss
  SCMP Business: https://www.scmp.com/rss/92/feed
  SCMP Tech: https://www.scmp.com/rss/36/feed
  Nikkei Asia: https://asia.nikkei.com/rss/feed/nar
  DW Business: https://rss.dw.com/rdf/rss-en-bus
  NL Times: https://nltimes.nl/rssfeed2
  DutchNews: https://www.dutchnews.nl/feed/

# Anthropic publishes no feed; its news page is read directly.
anthropic_news: https://www.anthropic.com/news

# Feeds carry each other's posts (NVIDIA's newsroom feed includes blog posts),
# so a card names the site a quote was actually published on.
source_by_host:
  blogs.nvidia.com: NVIDIA Blog
  nvidianews.nvidia.com: NVIDIA Newsroom
