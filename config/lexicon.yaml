# Native-language screening (2026-10-26), read by app/intelligence/language.py.
#
# A story not in English is screened in its own language before anything is
# translated: an exclude word drops it; otherwise it must name insurance (or,
# for a business feed, business or finance) in its headline -- or anywhere,
# when it comes from an insurance trade outlet. Only what passes is sent for
# translation, so the cost stays at a few dozen headlines a build.
#
# Matching is on lower-cased text. Latin-script words match whole words;
# Japanese, Chinese and Korean terms match anywhere (no spaces between words,
# or Korean endings joined to them).

pt:
  insurance: [seguro, seguros, seguradora, seguradoras, resseguro, resseguradora, apólice,
              apólices, sinistro, sinistros, previdência, corretora de seguros, corretor de seguros,
              susep, cnseg, fenaseg, plano de saúde, planos de saúde, ans, capitalização, prêmio, prêmios]
  business: [bilhões, milhões, lucro, receita, aquisição, fusão, ipo, banco central, juros]
  exclude: [como escolher, dicas, passo a passo, cotação online, simulador, webinar, inscrições,
            prêmio de melhor, evento, palestra, live, horóscopo, receita de bolo, promoção]

es:
  insurance: [seguro, seguros, aseguradora, aseguradoras, reaseguro, reaseguradora, póliza, pólizas,
              siniestro, siniestros, siniestralidad, corredor de seguros, correduría, mediador,
              dgsfp, cnsf, unespa, amis, prima, primas, mutua, mutualidad, previsión social]
  business: [millones, mil millones, beneficio, ingresos, adquisición, fusión, opv, banco central]
  exclude: [cómo elegir, consejos, guía para, comparador, webinar, jornada, inscripciones,
            premios, congreso, horóscopo, sorteo, oferta]

