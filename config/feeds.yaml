# The global feed registry (2026-10-26): insurance publications from
# Amit's "News sources" sheet, world business feeds for Asia, Africa and
# Latin America, and Google News insurance searches in more countries than
# India. Read by app/scraper/registry.py; the older feeds in
# app/scraper/sources.py are unchanged and get their country from
# `host_countries` below.
#
# Every entry carries where it reports from and in what language, so the
# ranker can cap one country's share of a tile (config/priority.yaml,
# geo_cap) and non-English stories go through the native-language gate and
# translation (app/intelligence/language.py, app/scraper/translate.py).
#
#   method   rss      the publisher's own feed (headline, teaser, picture)
#            search   a Google News search; `site:` limits it to one
#                     publisher. Used where the site has no feed a scraper
#                     can read. Gives headline, publisher and date only.
#   fallback a search run only when the rss returns nothing, so a feed that
#            moves or blocks the bot still yields that publisher's stories.
#   country  ISO 3166 alpha-2, or null for a feed that covers many countries
#            (the story's own country then comes from its headline).
#   trade    true for a sector specialist: its stories need not name the
#            sector in the headline, only pass the exclude list.
#
# Not added from the sheet: NATE (nate.com) and Sohu (m.sohu.com) are
# portals reposting other outlets' stories; News1 and Korea Insurance News,
# and China Daily, cover the same ground at the source. Revista Apolice
# Health repeated the Insurance row's URL; its health section is used. Segs
# and "Segs Insurance" overlapped; only the insurance section is read.
#
# None of these could be checked from the planning session (its network
# blocks them). The build logs each feed's count ("feed <id>: N stories"),
# so a feed that comes back empty shows in the Actions log.

regions:
  americas_n: [US, CA]
  latam: [MX, BR, AR, CL, CO, PE, UY, PY, BO, EC, VE, PA, CR, GT, DO, PR, CU, HN, SV, NI]
