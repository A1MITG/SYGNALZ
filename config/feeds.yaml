  mena: [AE, SA, QA, KW, BH, OM, IL, IR, IQ, JO, LB, EG, MA, DZ, TN, LY, YE, SY]
  africa: [NG, ZA, KE, GH, ET, TZ, UG, RW, SN, CI, CM, ZW, ZM, AO, MZ, BW, NA, SD, CD]
  south_asia: [IN, PK, BD, LK, NP]
