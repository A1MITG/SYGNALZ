# Google News editions: (hl, gl, ceid) per edition key.
editions:
  en-US: [en-US, US, 'US:en']
  en-GB: [en-GB, GB, 'GB:en']
  en-SG: [en-SG, SG, 'SG:en']
  en-ZA: [en-ZA, ZA, 'ZA:en']
  en-AE: [en, AE, 'AE:en']
  pt-BR: [pt-BR, BR, 'BR:pt-419']
  es-MX: [es-419, MX, 'MX:es-419']
  es-ES: [es, ES, 'ES:es']
  it-IT: [it, IT, 'IT:it']
  ja-JP: [ja, JP, 'JP:ja']
  ko-KR: [ko, KR, 'KR:ko']
  vi-VN: [vi, VN, 'VN:vi']
  zh-CN: [zh-CN, CN, 'CN:zh-Hans']

# A search with no `edition` uses its language's home edition.
default_edition:
  en: en-US
  pt: pt-BR
  es: es-ES
  it: it-IT
  ja: ja-JP
  ko: ko-KR
  vi: vi-VN
  zh: zh-CN

