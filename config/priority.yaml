# PRD §8 — Executive Importance Classification.
#
# "Executives should never be overwhelmed by volume." That makes this a
# QUOTA problem, not a threshold problem: whatever the absolute scores do on
# a given day, a reader should open the dashboard to a handful of must-reads,
# not forty.
#
# So bands are assigned by rank within the build, bounded by absolute floors.
# The quota stops a dramatic news day flooding the top band; the floor stops a
# quiet news day promoting filler into it. Neither alone is sufficient — with
# quotas only, the top 5% of a slow Tuesday becomes MUST_READ; with floors
# only, a wildfire week puts thirty articles above the line.
#
# This is also the first stage that is inherently RELATIVE. Sprints 1-7 score
# an article on its own. Priority is a judgement about an article's place in
# today's set, so it needs the whole batch.

bands:
  - { name: MUST_READ,  max_share: 0.05, min_score: 60 }
  - { name: IMPORTANT,  max_share: 0.20, min_score: 50 }
  - { name: WATCH,      max_share: 0.45, min_score: 40 }
  - { name: BACKGROUND, max_share: 1.00, min_score: 0 }

# Below this, an article is IGNORE regardless of rank.
ignore_below: 35

# §10. A development is one story; two outlets reporting it are two articles.
# The quota below is therefore a budget of DEVELOPMENTS, not of articles:
# only the highest-scoring member of a development competes for a ranked
# band. The rest are real coverage of a story already represented, so they
# are held at `follower_band` rather than discarded — findable in the store,
# absent from the brief. Set follower_band to IGNORE to drop them entirely.
developments:
  follower_band: BACKGROUND

# Conditions that force IGNORE whatever the score says. These are facts, not
# judgements: an article we cannot date, or cannot place in any domain, has
# no business being presented as today's executive intelligence.
hard_ignore:
  not_current: true        # failed the §3 freshness gate
  no_domain: true          # cleared no domain's evidence bar in §4

# 2026-10-26 — One country's share of a tile (app/analysis/geo_cap.py).
#
# The geo-bias check of 26 Oct found 45% of stories about India and 89% from
# Indian, UK or US outlets, with Banking and Economy about 90% Indian. A soft
# cap: past `max_country_share` of a tile's slots, a country's further
# stories wait; slots left empty are then refilled from them, best first, so
# the cap never empties a tile and never promotes a story below its floor.
# One slot is kept for the best story from outside the tile's top two
# countries when one qualifies. GCC is India by design; People Movers and
# Executive Pulse are built elsewhere and are not capped.
geo_cap:
  max_country_share: 0.5
  reserved_other_region_slots: 1
  min_candidates_for_cap: 4
  exempt_signals: [Signal GCC]

# The Insurance tile is the global insurance view, so it is stricter, and it
# ranks by what happened (config/events.yaml) rather than keyword count.
insurance_interest:
  max_per_country: 2
  min_regions: 3
  max_press_releases: 1
  no_event_weight: 0.8
  event_weights:
    REGULATION: 1.5
    NATURAL_DISASTER: 1.5
    ACQUISITION: 1.4
    MERGER: 1.4
    IPO: 1.4
    EARNINGS: 1.3
    FUNDING: 1.2
    PRODUCT_LAUNCH: 1.2
    EXECUTIVE_APPOINTMENT: 1.1
    EXECUTIVE_EXIT: 1.1
