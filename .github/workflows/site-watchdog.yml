name: Site watchdog

# Hourly: is the live data due one of its 3-hourly refresh slots? GitHub's
# scheduler has started "Build Signals (static)" 3 h 50 min and 5.5 h late,
# and once not at all, with nobody told, and Vercel's free plan can only run
# a cron once a day. So this watchdog is the primary driver of the schedule:
# six of the eight daily slots are started here, and that is routine, not an
# alarm. It only fails the run — and so emails the repo owner — when the data
# is stale (STALE_AFTER in site_health.py), meaning the builds it starts are
# not fixing the problem. The check itself is scripts/site_health.py watchdog
# (standard library only: no install step).

on:
  schedule:
    # :50 past the hour. Slots land at :30 past, so a slot that the Vercel
    # cron did not cover is picked up 20 minutes later; LATE_GRACE gives the
    # covered ones time to build first. Off the hour, where GitHub's
    # scheduler is busiest.
    - cron: "50 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

env:
  LIVE_URL: https://news-letter-cxo.vercel.app

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Is the live data due a refresh?
        id: check
        run: |
          set +e
          python scripts/site_health.py watchdog
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0: on time. 3: a slot is due (routine). 4: stale, the builds are
          # not fixing it. Anything else: the check itself failed.
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || [ "$code" -eq 4 ]

      - name: Start the build
        if: steps.check.outputs.code == '3' || steps.check.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow build-signals.yml --limit 5 --json status \
                 --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run build-signals.yml --ref "${{ github.event.repository.default_branch }}"
            echo "A refresh slot is due. A build has been started."
          else
            echo "A refresh slot is due. A build is already queued or running."
          fi
          # Starting a build is how most slots run now, so that succeeds
          # quietly. Stale data means the builds are not fixing it: fail, and
          # GitHub emails the repo owner.
          if [ "${{ steps.check.outputs.code }}" = "4" ]; then
            echo "::error::The live data is stale: the builds are not fixing it."
            exit 1
          fi
