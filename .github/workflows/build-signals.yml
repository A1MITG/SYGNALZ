name: Build Signals (static)

# Regenerates public/ every 3 hours, on the IST 3-hour grid (00:00, 03:00,
# ... 21:00), or on demand via "Run workflow". GitHub's own scheduler is
# unreliable (see below), so most slots are actually started by the hourly
# watchdog in site-watchdog.yml; this schedule is a best-effort backup and
# Vercel Cron covers two slots a day. Commits it to the working branch for
# history, and also
# force-pushes the relevant static files to two orphan branches —
# `signals-deploy` (Signals page) and `command-center-deploy` (Command
# Center) — the ones Vercel actually watches, since neither ever contains
# requirements.txt or .python-version and so can never trigger Vercel's
# Python auto-detection (see README's Vercel section for why that matters).
# No Vercel token or deploy hook is needed; the push itself triggers
# Vercel's redeploy.
#
# The test site: a push to `staging` (or "Run workflow" on it) builds the
# same way but publishes to `staging-deploy` only, which a separate Vercel
# project serves. It leaves `staging` itself, the live branch and the
# Command Center alone. sync-staging.yml keeps `staging` level with `final`.

on:
  schedule:
    # Every 3 hours on the IST grid: 00:00, 03:00 ... 21:00 IST, which is
    # :30 past every third UTC hour. Written out rather than as */3 because
    # tests/test_refresh_schedule.py parses the hour field directly. The page
    # says when the next refresh is due from REFRESH_SLOTS_IST in
    # build_command_center_data.py; that test keeps the two in step.
    - cron: "30 0,3,6,9,12,15,18,21 * * *"
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      full:
        description: "Test site only: fetch fresh news too (normally it reuses the live site's data)"
        type: boolean
        default: false

permissions:
  contents: write

# One build at a time: the hourly watchdog (site-watchdog.yml) may start a
# build while a late scheduled one is still queued. The second waits.
concurrency:
  group: build-signals
  cancel-in-progress: false

env:
  LIVE_URL: https://news-letter-cxo.vercel.app
  # `final` publishes the live site; `staging` the test site.
  DEPLOY_BRANCH: ${{ github.ref_name == 'staging' && 'staging-deploy' || 'signals-deploy' }}
  # A test-site build normally reuses the live site's latest data and only
  # rebuilds the pages from the code being tested: no news fetch, no NewsAPI
  # calls taken from the live builds. "Run workflow" with full fetches fresh.
  LIGHT_BUILD: ${{ github.ref_name == 'staging' && !inputs.full }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Any other branch would publish its untested build to the live site.
      - name: Build only final or staging
        run: |
          case "$GITHUB_REF_NAME" in
            final|staging) ;;
            *) echo "::error::Builds run on final (live site) or staging (test site), not $GITHUB_REF_NAME."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The daily archive: public/command_center_data.json still holds the
      # previous build here. If that was made on an earlier IST day, it was
      # that day's last build, and is filed as public/snapshots/YYYY-MM-DD.json
      # (scripts/archive_snapshot.py). Before the new build overwrites it.
      - name: File yesterday's last build in the archive
        if: env.LIGHT_BUILD != 'true'
        run: python scripts/archive_snapshot.py

      # Archive search: each newly filed day's stories as sentence embeddings
      # (public/search/YYYY-MM-DD.json, scripts/archive_search_index.py), from
      # the same small model the /archive page runs in the reader's browser.
      # The model (~23 MB) is cached between runs. Never blocks the build: a
      # day missed here is indexed by the next run.
      - name: Cache the archive search model
        if: env.LIGHT_BUILD != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/signal-search-model
          key: signal-search-model-all-MiniLM-L6-v2-q8

      - name: Index the archive for search
        if: env.LIGHT_BUILD != 'true'
        continue-on-error: true
        run: |
          pip install -r requirements-search.txt
          python scripts/archive_search_index.py

      - name: Build static Signals page
        if: env.LIGHT_BUILD != 'true'
        run: python scripts/build_static_signals.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # LLM tasks (translation): provider and model are set in
          # config/llm.yaml, or overridden with the Actions variables below.
          # Only the chosen provider's key is used; without it those
          # stories are left out and the build still runs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIGNAL_LLM_PROVIDER: ${{ vars.SIGNAL_LLM_PROVIDER }}
          SIGNAL_LLM_MODEL: ${{ vars.SIGNAL_LLM_MODEL }}

      - name: Build Command Center live data
        if: env.LIGHT_BUILD != 'true'
        run: python scripts/build_command_center_data.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIGNAL_LLM_PROVIDER: ${{ vars.SIGNAL_LLM_PROVIDER }}
          SIGNAL_LLM_MODEL: ${{ vars.SIGNAL_LLM_MODEL }}

      # Is public/ fit to go live? An error stops the run here: the site keeps
      # the last good build, and GitHub emails the repo owner.
      - name: Check the build before publishing
        if: env.LIGHT_BUILD != 'true'
        run: python scripts/site_health.py gate

      # The test site's light build: the live site's data and archive, with
      # this branch's pages. The data already passed the live build's check.
      - name: Use the live site's data (test site)
        if: env.LIGHT_BUILD == 'true'
        run: |
          git fetch -q --depth=1 origin signals-deploy
          for f in command_center_data.json signals.json brief.html; do
            git show "FETCH_HEAD:$f" > "public/$f"
          done
          git show FETCH_HEAD:signals.html > public/index.html
          rm -rf public/snapshots public/search
          git archive FETCH_HEAD snapshots search | tar -x -C public
          cp app/static/command_center_source.html public/command_center.html
          python -c "from pathlib import Path; from scripts.archive_snapshot import archived_dates, render_archive_page; Path('public/archive.html').write_text(render_archive_page(Path('app/static/command_center_source.html').read_text(encoding='utf-8'), archived_dates()), encoding='utf-8')"

      # Signal Civils (/civils): today's stories placed by the UPSC syllabus,
      # plus ~8 public feeds of its own (config/civils.yaml). Keyword rules,
      # no AI step, no NewsAPI. Reads public/command_center_data.json and
      # writes only civils.html and civils_data.json, so a failure here
      # leaves the rest of the build as it is.
      - name: Build Signal Civils page
        continue-on-error: true
        run: python scripts/build_civils.py

      # The test site's build is not committed: `staging` keeps only source
      # changes, so promoting it to `final` never clashes with the live builds.
      - name: Commit build to working branch
        if: github.ref_name != 'staging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Land on the branch as it is now, not as it was when this run
          # started: a push, or another build, may have landed meanwhile. Only
          # the files the build writes are this run's to change.
          # Archive snapshots are only ever added, never rewritten (-n).
          BUILT="command_center_data.json command_center.html brief.html index.html signals.json signal.css archive.html"
          mkdir -p /tmp/built/snapshots /tmp/built/search public/snapshots public/search
          for f in $BUILT; do cp "public/$f" /tmp/built/; done
          cp -r public/snapshots/. /tmp/built/snapshots/
          cp -r public/search/. /tmp/built/search/
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard FETCH_HEAD
          for f in $BUILT; do cp "/tmp/built/$f" public/; done
          mkdir -p public/snapshots public/search
          cp -rn /tmp/built/snapshots/. public/snapshots/
          cp -rn /tmp/built/search/. public/search/
          git add public/
          git diff --staged --quiet || git commit -m "Signals + Command Center rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # news-letter-cxo.vercel.app is wired to this branch, so its root is the
      # Command Center; the Signals page rides along at /signals (cleanUrls
      # maps /signals -> signals.html, matching the dashboard's nav links).
      - name: Publish to signals-deploy branch (Vercel source)
        run: |
          # staging-deploy for a staging build: the same files, see the end.
          rm -rf /tmp/signals-deploy
          mkdir -p /tmp/signals-deploy/img
          cp public/command_center.html /tmp/signals-deploy/index.html
          cp public/command_center_data.json /tmp/signals-deploy/
          # Every image the page uses (the portrait, the Manifesto background).
          cp public/img/* /tmp/signals-deploy/img/
          cp public/index.html /tmp/signals-deploy/signals.html
          cp public/signal.css public/signals.json /tmp/signals-deploy/
          # Today's Brief: the closer's button links /brief, which cleanUrls
          # serves from brief.html.
          cp public/brief.html /tmp/signals-deploy/brief.html
          # The daily archive: /archive (archive.html) draws one day from
          # /snapshots/YYYY-MM-DD.json. The snapshots live in the working
          # branch, since this branch is replaced on every build.
          cp public/archive.html /tmp/signals-deploy/archive.html
          # Signal Civils: /civils (civils.html) and its data. The step above
          # may have failed; then the page is simply left out of this build.
          for f in civils.html civils_data.json; do
            [ -f "public/$f" ] && cp "public/$f" /tmp/signals-deploy/ || true
          done
          mkdir -p /tmp/signals-deploy/snapshots /tmp/signals-deploy/search
          cp -r public/snapshots/. /tmp/signals-deploy/snapshots/
          cp -r public/search/. /tmp/signals-deploy/search/
          # The build's own alarm clock (BP-56): GitHub starts this workflow's
          # schedule 4-7 hours late, so Vercel Cron calls /api/trigger-build,
          # and that function starts this workflow through GitHub's API. It
          # needs CRON_SECRET and GITHUB_DISPATCH_TOKEN in the Vercel project;
          # deploy/api/trigger-build.js says how.
          #
          # Vercel's free plan runs a cron at most once a day, so these two
          # cover only the 09:00 and 21:00 IST slots (03:30 and 15:30 UTC;
          # the free plan runs each within the hour). The other six slots are
          # started by the hourly watchdog in site-watchdog.yml. Both times
          # must stay on the REFRESH_SLOTS_IST grid — tests/test_build_trigger.py
          # checks that.
          mkdir -p /tmp/signals-deploy/api
          cp deploy/api/trigger-build.js /tmp/signals-deploy/api/
          #
          # Only this branch deploys. The vercel.json at the root of `final`
          # (and so of every branch cut from it) switches Vercel's Git
          # deployments off, which keeps the free plan's 100 deploys a day
          # for the live site; this one switches them back on here.
          #
          # No ignoreCommand: one keyed on $VERCEL_ENV cancelled every
          # production deploy (25 Oct 2026), so the variable is not what the
          # docs promise at that step. The other project building a preview
          # of this branch costs a deploy; skipping production costs the site.
          cat > /tmp/signals-deploy/vercel.json <<'JSON'
          {
            "git": { "deploymentEnabled": { "signals-deploy": true } },
            "cleanUrls": true,
            "crons": [
              { "path": "/api/trigger-build", "schedule": "30 3 * * *" },
              { "path": "/api/trigger-build", "schedule": "30 15 * * *" }
            ]
          }
          JSON
          cd /tmp/signals-deploy
          # The test site: no crons (they would start live builds), and
          # deploys switched on for its own branch instead.
          if [ "$DEPLOY_BRANCH" = staging-deploy ]; then
            jq '{git: {deploymentEnabled: {"staging-deploy": true}}, cleanUrls}' vercel.json > vercel.tmp
            mv vercel.tmp vercel.json
          fi
          git init -q
          git checkout -q -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html command_center_data.json img signals.html signal.css signals.json brief.html archive.html snapshots search vercel.json api
          git add civils.html civils_data.json 2>/dev/null || true
          git commit -q -m "Signals rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$DEPLOY_BRANCH"

      - name: Publish to command-center-deploy branch (Vercel source)
        if: github.ref_name != 'staging'
        run: |
          rm -rf /tmp/command-center-deploy
          mkdir /tmp/command-center-deploy
          cp public/command_center.html /tmp/command-center-deploy/index.html
          cp public/command_center_data.json /tmp/command-center-deploy/command_center_data.json
          mkdir -p /tmp/command-center-deploy/img
          cp public/img/* /tmp/command-center-deploy/img/
          # No Vercel project serves this branch, so keep its pushes from
          # spending a deploy on each project.
          cat > /tmp/command-center-deploy/vercel.json <<'VJSON'
          { "git": { "deploymentEnabled": false } }
          VJSON
          cd /tmp/command-center-deploy
          git init -q
          git checkout -q -b command-center-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html command_center_data.json img vercel.json
          git commit -q -m "Command Center rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" command-center-deploy

      # Is Vercel serving this build? It redeploys on the signals-deploy push
      # within a minute or two. A failure means the site did not update.
      - name: Check the live site
        if: github.ref_name != 'staging'
        run: python scripts/site_health.py deployed
